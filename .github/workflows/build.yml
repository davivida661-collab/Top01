name: Build Syntax

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure C++
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build DLL
        run: cmake --build build --config Release --parallel

      - name: Build UI .exe
        run: dotnet publish ui/SyntaxUI.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Bundle
        shell: pwsh
        run: |
          Copy-Item build/Release/Syntax.dll publish/
          if (Test-Path build/Release/Syntax.lib) { Copy-Item build/Release/Syntax.lib publish/ }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Syntax-x64-Release
          path: publish/*
          if-no-files-found: error
